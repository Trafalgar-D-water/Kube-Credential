apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-service
  namespace: kube-credential
spec:
  replicas: 2
  selector:
    matchLabels:
      app: verification-service
  template:
    metadata:
      labels:
        app: verification-service
    spec:
      containers:
        - name: verification
          image: <ECR_URI>/verification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: DB_PATH
              value: "/data/certifications.sqlite"
          volumeMounts:
            - name: certs-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: certs-data
          persistentVolumeClaim:
            claimName: certs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: verification-service
  namespace: kube-credential
spec:
  selector:
    app: verification-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081

